<style>
  :root {
    --ink: #241820;
    --muted: #6B5A63;
    --cream: #FAF3EC;
    --surface: #fff;
    --rose: #D9A6A2;
    --rose-deep: #B97E7C;
    --berry: #7A2E3A;
    --berry-deep: #5C2029;
    --on-berry: #FAF3EC;
    --sand: #C9AD84;
    --line: rgba(36, 24, 32, 0.12);
    --serif: Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #F3E9E4;
      --muted: #B8A9AF;
      --cream: #1B1417;
      --surface: #241B1F;
      --line: rgba(243, 233, 228, 0.14);
    }
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    background: var(--cream);
    color: var(--ink);
    font-family: var(--sans);
    display: flex;
    justify-content: center;
    padding: calc(48px + env(safe-area-inset-top, 0px)) 20px calc(56px + env(safe-area-inset-bottom, 0px));
  }
  .card { width: 100%; max-width: 420px; }
  .avatar {
    width: 104px; height: 104px; margin: 0 auto 22px; border-radius: 50%;
    display: block; object-fit: cover;
    box-shadow: 0 0 0 3px var(--cream), 0 0 0 4px var(--sand);
  }
  h1 {
    font-family: var(--serif);
    font-weight: 600; font-size: 30px; line-height: 1.15;
    text-align: center; margin: 0 0 8px; color: var(--ink);
  }
  .tagline {
    text-align: center; font-size: 15px; line-height: 1.5; color: var(--muted);
    margin: 0 auto 28px; max-width: 34ch;
  }
  .socials { display: flex; justify-content: center; gap: 14px; margin-bottom: 32px; }
  .socials a {
    width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--surface); display: flex; align-items: center; justify-content: center;
    color: var(--ink); transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .socials a svg { width: 20px; height: 20px; }
  .socials a:hover, .socials a:focus-visible {
    border-color: var(--berry); background: var(--rose); color: var(--berry-deep); transform: translateY(-2px);
  }
  .links { display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px; }
  .link-cta, .link-card {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 16px 18px;
    border-radius: 14px; text-decoration: none; font-size: 15px; font-weight: 500;
    border: 1px solid var(--line);
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .link-cta {
    background: var(--berry); color: var(--on-berry); border-color: var(--berry);
    font-family: var(--serif); font-size: 17px; font-weight: 600; justify-content: center;
  }
  .link-card { background: var(--surface); color: var(--ink); }
  .link-card .icon { flex: none; width: 22px; height: 22px; color: var(--berry); }
  .link-cta:hover, .link-cta:focus-visible {
    background: var(--berry-deep); border-color: var(--berry-deep); transform: translateY(-1px);
  }
  .link-card:hover, .link-card:focus-visible {
    border-color: var(--rose-deep); box-shadow: 0 6px 18px -12px rgba(36, 24, 32, 0.35); transform: translateY(-1px);
  }
  .divider { height: 1px; background: var(--line); margin: 0 0 24px; }
  .videos-title {
    font-family: var(--serif);
    font-size: 18px; text-align: center; margin: 0 0 4px; color: var(--ink);
  }
  .videos-note { text-align: center; font-size: 13px; color: var(--muted); margin: 0 0 16px; }
  .videos {
    display: flex; gap: 12px; overflow-x: auto;
    padding-bottom: 8px; scroll-snap-type: x mandatory;
  }
  .videos > * { flex: none; scroll-snap-align: start; }
  .video-facade {
    width: 200px; aspect-ratio: 9 / 16; border-radius: 14px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    text-decoration: none; color: var(--on-berry); font-size: 15px; font-weight: 500;
    background: linear-gradient(160deg, var(--rose-deep), var(--berry-deep));
  }
  .video-facade .play {
    width: 56px; height: 56px; border-radius: 50%;
    background: rgba(250, 243, 236, 0.18); display: flex; align-items: center; justify-content: center;
  }
  .video-facade .play svg { width: 24px; height: 24px; margin-left: 3px; }
  .videos iframe { width: 260px; height: 740px; border: 0; border-radius: 14px; background: var(--surface); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--berry); outline-offset: 2px; }
  footer {
    text-align: center; margin-top: 40px; font-size: 12px; line-height: 1.5; color: var(--muted);
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<body>

<script>
  // Carga el reproductor de TikTok solo cuando la persona toca el video.
  // Sin JavaScript, el enlace abre el video directamente en TikTok.
  document.querySelectorAll(".video-facade").forEach(function (link) {
    link.addEventListener("click", function (e) {
      e.preventDefault();
      var iframe = document.createElement("iframe");
      iframe.src = "https://www.tiktok.com/embed/v2/" + link.dataset.videoId + "?lang=es";
      iframe.title = link.getAttribute("aria-label");
      iframe.allow = "encrypted-media; fullscreen; picture-in-picture";
      iframe.allowFullscreen = true;
      link.replaceWith(iframe);
      iframe.focus();
    });
  });
</script>
