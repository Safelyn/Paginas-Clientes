<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sara Sucerquia Nails</title>
<meta name="description" content="Perfil de contacto y redes de Sara Sucerquia Nails.">

<style>
  :root {
    --ink: #241820;
    --cream: #FAF3EC;
    --rose: #D9A6A2;
    --rose-deep: #B97E7C;
    --berry: #7A2E3A;
    --berry-deep: #5C2029;
    --sand: #C9AD84;
    --line: rgba(36, 24, 32, 0.12);
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-height: 100svh;
    background: var(--cream);
    color: var(--ink);
    font-family: "Work Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    justify-content: center;
    padding: calc(48px + env(safe-area-inset-top, 0px)) 20px calc(56px + env(safe-area-inset-bottom, 0px));
  }
  .card { width: 100%; max-width: 420px; }
  .avatar {
    width: 104px; height: 104px; margin: 0 auto 22px; border-radius: 50%;
    display: block; object-fit: cover;
    box-shadow: 0 0 0 3px var(--cream), 0 0 0 4px var(--sand);
  }
  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-optical-sizing: auto; font-weight: 560; font-size: 30px; line-height: 1.15;
    text-align: center; margin: 0 0 8px; color: var(--ink);
  }
  .tagline {
    text-align: center; font-size: 15px; line-height: 1.5;
    color: color-mix(in srgb, var(--ink) 62%, transparent);
    margin: 0 0 28px; max-width: 34ch; margin-left: auto; margin-right: auto;
  }
  .socials { display: flex; justify-content: center; gap: 14px; margin-bottom: 32px; }
  .socials a {
    width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line);
    background: #fff; display: flex; align-items: center; justify-content: center;
    color: var(--ink); transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .socials a svg { width: 20px; height: 20px; }
  .socials a:hover, .socials a:focus-visible {
    border-color: var(--berry); background: var(--rose); color: var(--berry-deep); transform: translateY(-2px);
  }
  .tiktok-title {
    font-family: "Fraunces", Georgia, serif;
    font-size: 18px; text-align: center; margin: 0 0 16px; color: var(--ink);
  }
  .tiktok-grid {
    display: flex; gap: 12px; overflow-x: auto;
    padding-bottom: 8px; margin-bottom: 28px;
  }
  .tiktok-grid > * { flex: none; }
  .divider { height: 1px; background: var(--line); margin: 0 0 24px; }
  .links { display: flex; flex-direction: column; gap: 12px; }
  .link-cta, .link-card {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 16px 18px;
    border-radius: 14px; text-decoration: none; font-size: 15px; font-weight: 500;
    border: 1px solid var(--line);
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  .link-cta {
    background: var(--berry); color: var(--cream); border-color: var(--berry);
    font-family: "Fraunces", Georgia, serif; font-size: 17px; font-weight: 560; justify-content: center;
  }
  .link-card { background: #fff; color: var(--ink); }
  .link-card .icon { flex: none; width: 22px; height: 22px; color: var(--berry); }
  .link-cta:hover, .link-cta:focus-visible {
    background: var(--berry-deep); border-color: var(--berry-deep); transform: translateY(-1px);
  }
  .link-card:hover, .link-card:focus-visible {
    border-color: var(--rose-deep); box-shadow: 0 6px 18px -12px rgba(36, 24, 32, 0.35); transform: translateY(-1px);
  }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--berry); outline-offset: 2px; }
  footer {
    text-align: center; margin-top: 40px; font-size: 12px;
    color: color-mix(in srgb, var(--ink) 45%, transparent);
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --cream: #1B1417; --ink: #F3E9E4; --line: rgba(243, 233, 228, 0.14); }
    :root:not([data-theme="light"]) .link-card { background: #241B1F; }
    :root:not([data-theme="light"]) .socials a { background: #241B1F; }
  }
</style>
</head>
<body>

  <main class="card">
    <img class="avatar" id="avatar" src="foto.jpg" alt="Foto de perfil de Sara">
    <h1 id="nombre">Sara Sucerqui Nails</h1>
    <p class="tagline" id="tagline">Uñas semipermanentes y nail art en Medellín. Agenda tu cita o mirá mis últimos diseños.</p>

    <nav class="socials" id="socials" aria-label="Redes sociales"></nav>

<h2 class="tiktok-title">Mis videos</h2>
    <div class="tiktok-grid">
      <blockquote class="tiktok-embed" cite="https://www.tiktok.com/@sarasucerquianails/video/7509591002353651000" data-video-id="7509591002353651000" style="max-width: 260px;min-width: 220px;">
        <section>
          <a target="_blank" title="@sarasucerquianails" href="https://www.tiktok.com/@sarasucerquianails?refer=embed">@sarasucerquianails</a>
        </section>
      </blockquote>
      <blockquote class="tiktok-embed" cite="https://www.tiktok.com/@sarasucerquianails/video/7606434662868651272" data-video-id="7606434662868651272" style="max-width: 260px;min-width: 220px;">
        <section>
          <a target="_blank" title="@sarasucerquianails" href="https://www.tiktok.com/@sarasucerquianails?refer=embed">@sarasucerquianails</a>
        </section>
      </blockquote>
    </div>
    <script async src="https://www.tiktok.com/embed.js"></script>
    <div class="divider"></div>

    <div class="links" id="links"></div>

    <footer>Hecho a mano, sin rastreadores de terceros.</footer>
  </main>

<script>
  const perfil = {
    nombre: "Sara Sucerqui Nails",
    tagline: "Uñas semipermanentes y nail art en Medellín. Agenda tu cita o mirá mis últimos diseños.",
    redes: [
      { tipo: "instagram", url: "https://instagram.com/sarasucerquianails" },
      { tipo: "tiktok",     url: "https://tiktok.com/@sarasucerquianails" },
      { tipo: "whatsapp",   url: "https://wa.me/573006306367" },
    ],
    enlaces: [
      { texto: "Agenda tu cita por WhatsApp", url: "https://wa.me/573006306367", tipo: "cta" },
      { texto: "Sigueme en Instagram",        url: "https://instagram.com/sarasucerquianails", tipo: "card", icono: "instagram" },
    ]
  };

  const ICONS = {
    instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1"/></svg>',
    tiktok: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14.5 3c.4 2.2 1.9 3.7 4.1 4v3c-1.5 0-2.9-.4-4.1-1.2v6.4c0 3.2-2.6 5.8-5.8 5.8S3 18.4 3 15.2s2.6-5.8 5.8-5.8c.4 0 .8 0 1.2.1v3.1a2.8 2.8 0 1 0 2.8 2.8V3h1.7z"/></svg>',
    whatsapp: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm0 18.1a8 8 0 0 1-4.1-1.1l-.3-.2-3.1.8.8-3-.2-.3A8.1 8.1 0 1 1 12 20.1zm4.4-6c-.2-.1-1.4-.7-1.6-.8-.2-.1-.4-.1-.5.1-.2.2-.6.8-.8 1-.1.1-.3.2-.5.1-.2-.1-1-.4-1.9-1.2-.7-.6-1.2-1.4-1.3-1.6-.1-.2 0-.4.1-.5l.4-.4c.1-.1.2-.3.2-.4.1-.2 0-.3 0-.4l-.7-1.7c-.2-.4-.4-.4-.5-.4h-.5c-.2 0-.4.1-.6.3-.2.2-.8.8-.8 1.9s.8 2.2.9 2.4c.1.1 1.6 2.5 3.9 3.5.5.2.9.4 1.3.5.5.2 1 .1 1.4.1.4-.1 1.4-.6 1.6-1.1.2-.5.2-1 .1-1.1-.1-.1-.2-.2-.4-.3z"/></svg>',
    google: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>'
  };

  document.getElementById("nombre").textContent = perfil.nombre;
  document.getElementById("tagline").textContent = perfil.tagline;
  document.title = perfil.nombre;

  const socialsEl = document.getElementById("socials");
  perfil.redes.forEach(r => {
    const a = document.createElement("a");
    a.href = r.url;
    a.target = "_blank";
    a.rel = "noopener";
    a.setAttribute("aria-label", r.tipo);
    a.innerHTML = ICONS[r.tipo] || "";
    socialsEl.appendChild(a);
  });

  const linksEl = document.getElementById("links");
  perfil.enlaces.forEach(l => {
    const a = document.createElement("a");
    a.href = l.url;
    a.target = "_blank";
    a.rel = "noopener";
    if (l.tipo === "cta") {
      a.className = "link-cta";
      a.textContent = l.texto;
    } else {
      a.className = "link-card";
      a.innerHTML = `<span class="icon">${ICONS[l.icono] || ""}</span><span>${l.texto}</span>`;
    }
    linksEl.appendChild(a);
  });
</script>
</body>
</html>
