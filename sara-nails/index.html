<style>
  :root {
    --ink: #241820;
    --muted: #6B5A63;
    --cream: #FAF3EC;
    --blush: #F6E4E1;
    --surface: #fff;
    --rose: #D9A6A2;
    --rose-deep: #B97E7C;
    --berry: #7A2E3A;
    --berry-deep: #5C2029;
    --on-berry: #FAF3EC;
    --sand: #C9AD84;
    --line: rgba(36, 24, 32, 0.12);
    --shadow: 0 14px 30px -18px rgba(92, 32, 41, 0.55);
    --serif: Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #F3E9E4;
      --muted: #B8A9AF;
      --cream: #1B1417;
      --blush: #2E1C22;
      --surface: #241B1F;
      --line: rgba(243, 233, 228, 0.14);
      --shadow: 0 14px 30px -18px rgba(0, 0, 0, 0.8);
    }
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    background:
      radial-gradient(120% 60% at 50% 0%, var(--blush) 0%, transparent 70%),
      var(--cream);
    background-repeat: no-repeat;
    color: var(--ink);
    font-family: var(--sans);
    display: flex;
    justify-content: center;
    padding: calc(32px + env(safe-area-inset-top, 0px)) 20px calc(48px + env(safe-area-inset-bottom, 0px));
  }
  .card { width: 100%; max-width: 420px; }

  /* Encabezado */
  .avatar-ring {
    width: 124px; height: 124px; margin: 0 auto 18px; border-radius: 50%; padding: 4px;
    background: conic-gradient(from 200deg, var(--rose), var(--berry), var(--sand), var(--rose));
  }
  .avatar {
    width: 116px; height: 116px; border-radius: 50%; display: block; object-fit: cover;
    border: 3px solid var(--cream);
  }
  h1 {
    font-family: var(--serif);
    font-weight: 600; font-size: 30px; line-height: 1.15;
    text-align: center; margin: 0 0 10px; color: var(--ink);
  }
  .badge {
    display: block; width: fit-content; margin: 0 auto 12px; padding: 5px 12px; border-radius: 999px;
    font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--berry); background: var(--surface); border: 1px solid var(--line);
  }
  .tagline {
    text-align: center; font-size: 15px; line-height: 1.5; color: var(--muted);
    margin: 0 auto 20px; max-width: 32ch;
  }
  .socials { display: flex; justify-content: center; gap: 14px; margin-bottom: 24px; }
  .socials a {
    width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--surface); display: flex; align-items: center; justify-content: center;
    color: var(--ink); transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .socials a svg { width: 20px; height: 20px; }
  .socials a:hover, .socials a:focus-visible {
    border-color: var(--berry); background: var(--rose); color: var(--berry-deep); transform: translateY(-2px);
  }

  /* Botón principal */
  .link-cta {
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 17px 14px; margin-bottom: 28px; border-radius: 16px;
    text-decoration: none; text-align: center;
    font-family: var(--serif); font-size: clamp(15px, 4.3vw, 18px); font-weight: 600;
    background: linear-gradient(135deg, var(--berry), var(--berry-deep));
    color: var(--on-berry); box-shadow: var(--shadow);
    animation: pulse 2.6s ease-in-out infinite;
    transition: transform 0.15s ease;
  }
  .link-cta svg { width: 22px; height: 22px; flex: none; }
  .link-cta::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, 0.22) 50%, transparent 70%);
    transform: translateX(-100%);
    animation: shine 3.5s ease-in-out infinite;
  }
  .link-cta:hover, .link-cta:focus-visible { transform: translateY(-1px); }
  @keyframes pulse {
    0%, 100% { box-shadow: var(--shadow), 0 0 0 0 rgba(122, 46, 58, 0.35); }
    50% { box-shadow: var(--shadow), 0 0 0 8px rgba(122, 46, 58, 0); }
  }
  @keyframes shine {
    0%, 60% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  /* Videos */
  .section-title {
    font-family: var(--serif); font-size: 20px; font-weight: 600;
    margin: 0 0 12px; color: var(--ink);
  }
  .videos {
    display: flex; gap: 12px; overflow-x: auto;
    margin: 0 -20px 16px; padding: 0 20px 10px;
    scroll-snap-type: x mandatory; scroll-padding: 0 20px;
    scrollbar-width: none;
  }
  .videos::-webkit-scrollbar { display: none; }
  .clip {
    position: relative; flex: none; width: min(62vw, 230px); aspect-ratio: 9 / 16;
    margin: 0; border-radius: 18px; overflow: hidden; scroll-snap-align: start;
    background: var(--blush); box-shadow: var(--shadow);
  }
  .clip video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .clip figcaption {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 36px 14px 12px;
    background: linear-gradient(transparent, rgba(0, 0, 0, 0.6));
    color: #fff; font-size: 14px; font-weight: 600; pointer-events: none;
  }

  /* Enlaces secundarios */
  .links { display: flex; flex-direction: column; gap: 12px; }
  .link-card {
    display: flex; align-items: center; gap: 12px; width: 100%; padding: 16px 18px;
    border-radius: 14px; text-decoration: none; font-size: 15px; font-weight: 500;
    background: var(--surface); color: var(--ink); border: 1px solid var(--line);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .link-card .icon { flex: none; width: 22px; height: 22px; color: var(--berry); }
  .link-card .arrow { margin-left: auto; color: var(--muted); }
  .link-card:hover, .link-card:focus-visible {
    border-color: var(--rose-deep); box-shadow: var(--shadow); transform: translateY(-1px);
  }

  a:focus-visible { outline: 2px solid var(--berry); outline-offset: 2px; }
  footer {
    text-align: center; margin-top: 36px; font-size: 12px; line-height: 1.5; color: var(--muted);
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>

<script>
  // Algunos celulares (por ejemplo, iPhone en modo ahorro de batería) bloquean la
  // reproducción automática. En ese caso, el video arranca al tocarlo.
  document.querySelectorAll(".clip video").forEach(function (video) {
    video.addEventListener("click", function () {
      if (video.paused) video.play(); else video.pause();
    });
  });
</script>
