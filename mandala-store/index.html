<style>
  :root {
    --bg: #0B0A09;
    --surface: #161412;
    --ink: #F3EADB;
    --muted: #A59B8C;
    --accent: #E9D3AE;
    --accent-deep: #B99A6B;
    --accent-soft: rgba(233, 211, 174, 0.1);
    --line: rgba(233, 211, 174, 0.16);
    --serif: "Cinzel", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; min-height: 100svh;
    background: var(--bg); color: var(--ink); font-family: var(--sans);
    overflow-x: hidden;
  }

  /* Arcos del logo, muy suaves, de fondo */
  .ambient {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(circle at 50% 18%, rgba(233, 211, 174, 0.13), transparent 55%),
      repeating-radial-gradient(circle at 50% 18%, transparent 0 46px, rgba(233, 211, 174, 0.045) 46px 48px);
    -webkit-mask-image: linear-gradient(to bottom, #000 30%, transparent 85%);
            mask-image: linear-gradient(to bottom, #000 30%, transparent 85%);
  }

  .page {
    position: relative; z-index: 1; width: 100%; max-width: 460px; margin: 0 auto;
    padding: calc(56px + env(safe-area-inset-top, 0px)) 20px calc(44px + env(safe-area-inset-bottom, 0px));
    text-align: center;
  }

  .logo {
    width: 168px; height: 168px; margin: 0 auto 22px; border-radius: 50%; overflow: hidden;
    border: 1px solid var(--line);
    box-shadow: 0 0 0 8px var(--accent-soft), 0 24px 50px -20px rgba(233, 211, 174, 0.45);
  }
  /* La imagen trae un borde gris alrededor del círculo: se recorta con un poco de zoom */
  .logo img { display: block; width: 100%; height: 100%; object-fit: cover; transform: scale(1.1); }

  h1 {
    margin: 0; font-family: var(--serif); font-weight: 600; text-transform: uppercase;
    font-size: clamp(32px, 10vw, 42px); letter-spacing: 0.14em; line-height: 1.1; color: var(--accent);
  }
  .tagline { margin: 10px auto 26px; max-width: 30ch; font-size: 15px; line-height: 1.5; color: var(--muted); }

  .cta {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; min-height: 62px; padding: 16px; margin-bottom: 14px; border-radius: 18px;
    text-decoration: none; font-weight: 800; font-size: clamp(16px, 4.6vw, 18px);
    background: linear-gradient(135deg, #F1DEBD, var(--accent-deep)); color: #17110A;
    box-shadow: 0 16px 34px -18px rgba(233, 211, 174, 0.6);
    animation: pulse 2.6s ease-in-out infinite;
  }
  .cta svg { width: 22px; height: 22px; flex: none; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 16px 34px -18px rgba(233, 211, 174, 0.6), 0 0 0 0 rgba(233, 211, 174, 0.35); }
    50% { box-shadow: 0 16px 34px -18px rgba(233, 211, 174, 0.6), 0 0 0 9px rgba(233, 211, 174, 0); }
  }

  .links { display: flex; flex-direction: column; gap: 12px; text-align: left; }
  .link-card {
    display: flex; align-items: center; gap: 14px; width: 100%; padding: 15px 18px; min-height: 64px;
    border-radius: 16px; text-decoration: none; font-size: 15px; font-weight: 600;
    background: var(--surface); color: var(--ink); border: 1px solid var(--line);
    transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .link-card .icon {
    flex: none; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent);
  }
  .link-card .icon svg { width: 21px; height: 21px; }
  .link-card small { display: block; margin-top: 2px; font-size: 13px; font-weight: 400; color: var(--muted); }
  .link-card .arrow { margin-left: auto; color: var(--muted); }
  .link-card:hover, .link-card:focus-visible { border-color: var(--accent); background: #1D1A17; transform: translateY(-1px); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* Videos: carrusel horizontal, se desliza con el dedo */
  .section-title {
    margin: 30px 0 14px; font-family: var(--serif); font-weight: 600; font-size: 18px;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent);
  }
  .videos {
    display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory;
    margin: 0 -20px 28px; padding: 0 20px 6px; scrollbar-width: none;
  }
  .videos::-webkit-scrollbar { display: none; }
  .clip { flex: 0 0 62%; margin: 0; scroll-snap-align: center; text-align: left; }
  .clip video {
    display: block; width: 100%; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 18px;
    background: var(--surface); border: 1px solid var(--line); cursor: pointer;
  }
  .clip figcaption { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .clip figcaption b { color: var(--ink); font-weight: 600; }

  footer { margin-top: 36px; font-size: 12px; line-height: 1.6; color: var(--muted); }
  footer .marca { display: block; font-family: var(--serif); letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); font-size: 13px; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

<script>
  // Algunos celulares bloquean la reproducción automática; en ese caso el video arranca al tocarlo.
  document.querySelectorAll(".clip video").forEach(function (video) {
    video.addEventListener("click", function () {
      if (video.paused) video.play(); else video.pause();
    });
  });
</script>
